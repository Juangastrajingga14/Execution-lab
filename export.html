<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Backup EXECUTION LAB</title>
</head>
<body>
<h2>Backup Trade EXECUTION LAB</h2>
<button id="export">DOWNLOAD BACKUP JSON</button>
<p id="status">Siap mengekspor data.</p>
<script>
document.getElementById("export").onclick = () => {
  const raw = localStorage.getItem("executionLabTrades");
  if (!raw) {
    document.getElementById("status").textContent = "Data trade tidak ditemukan.";
    return;
  }
  const blob = new Blob([raw], {type:"application/json"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = "execution-lab-backup.json";
  a.click();
  URL.revokeObjectURL(url);
  document.getElementById("status").textContent = "Backup berhasil diunduh.";
};
</script>
</body>
</html>
